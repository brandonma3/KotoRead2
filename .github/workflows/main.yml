      - name: 下載官方 Gradle 8.7 並編譯 APK
        working-directory: /tmp/kotoread_build
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
          unzip -q /tmp/gradle-8.7.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug --stacktrace --no-daemon

      - name: 上傳編譯完成的 APK 檔案供直接下載
        uses: actions/upload-artifact@v4
        with:
          name: KotoRead-NovelReader-APK
          path: /tmp/kotoread_build/app/build/outputs/apk/debug/app-debug.apk
